<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kerf — AI builds your site. Import it into WordPress in one click.</title>
<meta name="description" content="Kerf turns the HTML your AI tool made into a real, editable WordPress site. The same design, pixel for pixel.">
<meta name="theme-color" content="#07080d">
<link rel="icon" href="assets/img/icon-128x128.png">
<style>
:root { color-scheme: dark; }
html, body { margin: 0; min-height: 100%; }
body { background: #07080d; color: #eef0f6; font: 17px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; place-items: center; min-height: 100vh; padding: 24px 16px; box-sizing: border-box; }
main { max-width: 640px; text-align: center; }
img { width: 72px; height: 72px; border-radius: 18px; }
h1 { font-size: clamp(32px, 6vw, 52px); line-height: 1.05; letter-spacing: -0.03em; margin: 28px 0 16px; }
h1 span { background: linear-gradient(90deg, #13c6f2, #2f6bff 50%, #8a4dff); -webkit-background-clip: text; background-clip: text; color: transparent; }
p { color: #a0a8bd; margin: 0 0 28px; }
a.btn { display: inline-block; padding: 14px 26px; border-radius: 999px; background: linear-gradient(90deg, #13c6f2, #2f6bff 50%, #8a4dff); color: #fff; font-weight: 600; text-decoration: none; }
a.btn:focus-visible { outline: 3px solid #13c6f2; outline-offset: 3px; }
small { display: block; margin-top: 18px; color: #6b7390; }
</style>
</head>
<body>
<main>
	<img src="assets/img/icon-256x256.png" alt="Kerf" width="72" height="72">
	<h1>AI builds your site. Import it into WordPress <span>in one click.</span></h1>
	<p>Kerf turns the HTML from ChatGPT, Claude, Gemini or any designer into a real WordPress site: the same design, with every word and picture editable. The full site is on its way.</p>
	<a class="btn" href="https://playground.wordpress.net/?blueprint-url=https://kerf.site/demo/blueprint.json" target="_blank" rel="noopener">Try the live demo</a>
	<small>Runs in your browser. No sign-up.</small>
</main>
</body>
</html>
