<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="robots" content="noindex">
  <title>Kerf live demo</title>
  <link rel="icon" href="../assets/img/icon-128x128.png">
  <link rel="apple-touch-icon" href="../assets/img/icon-256x256.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
  <link rel="stylesheet" href="../assets/css/site.css">
  <style>
    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
    }

    .demo-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-width: 0;
      padding: 10px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      color: var(--text);
    }

    .demo-bar .brand-logo {
      width: 44px;
      height: 44px;
      margin: -4px -6px -4px -8px;
    }

    .demo-note {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .demo-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      margin: 0;
    }

    .demo-stage {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .demo-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg);
    }

    .demo-overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      text-align: center;
      font-size: 16px;
    }

    .demo-overlay[hidden] {
      display: none;
    }

    .demo-overlay p + p {
      margin-top: 12px;
    }

    @media (max-width: 1100px) {
      .demo-note {
        display: none;
      }
    }

    @media (max-width: 600px) {
      .demo-bar {
        display: grid;
        justify-content: stretch;
        gap: 8px;
        padding: 8px 12px 10px;
      }

      .demo-bar .brand {
        justify-self: center;
        font-size: 21px;
      }

      .demo-bar .brand-logo {
        width: 36px;
        height: 36px;
      }

      .demo-actions {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
      }

      .demo-actions .btn {
        padding: 8px 12px;
        font-size: 13px;
        line-height: 1.3;
        white-space: normal;
        text-align: center;
      }
    }
  </style>
  <noscript>
    <style>
      #demo-loading { display: none; }
    </style>
  </noscript>
</head>
<body>
  <header class="demo-bar">
    <a class="brand" href="../">
      <img class="brand-logo" src="../assets/img/kerf-logo.png" width="44" height="44" alt="">
      <span>Kerf</span>
    </a>
    <p class="demo-note">Live demo: WordPress running in your browser. Nothing is saved.</p>
    <nav class="demo-actions" aria-label="Demo actions">
      <a class="btn btn-secondary btn-sm" href="copperline-studio.zip" download>Download the sample design</a>
      <a class="btn btn-primary btn-sm" href="../#pricing">Buy Kerf</a>
    </nav>
  </header>
  <main class="demo-stage">
    <iframe id="demo-frame" class="demo-frame" allow="clipboard-write" title="Kerf live demo in WordPress"></iframe>
    <div id="demo-overlay" class="demo-overlay" role="status" aria-live="polite">
      <p id="demo-loading">Starting WordPress in your browser… about 20–40 seconds</p>
      <div id="demo-error" hidden>
        <p>WordPress could not start in this page.</p>
        <p><button class="btn btn-primary btn-sm" type="button" onclick="location.reload()">Try again</button></p>
        <p><a href="https://playground.wordpress.net/?blueprint-url=https://kerf.site/demo/blueprint.json">Open the demo in WordPress Playground instead</a></p>
      </div>
      <noscript>
        <p>JavaScript is required to start WordPress in this page.</p>
        <p><a href="https://playground.wordpress.net/?blueprint-url=https://kerf.site/demo/blueprint.json">Open the demo in WordPress Playground instead</a></p>
      </noscript>
    </div>
  </main>
  <script type="module" onerror="document.getElementById('demo-loading').hidden = true; document.getElementById('demo-error').hidden = false;">
    import { startPlaygroundWeb } from 'https://playground.wordpress.net/client/index.js';

    const overlay = document.getElementById('demo-overlay');
    const loading = document.getElementById('demo-loading');

    // The blueprint beside this page; a page opened from disk cannot fetch it,
    // so it falls back to kerf.site's.
    async function loadBlueprint() {
      for (const url of ['./blueprint.json', 'https://kerf.site/demo/blueprint.json']) {
        try {
          const response = await fetch(url);
          if (response.ok) {
            return await response.json();
          }
        } catch (error) {
          // Try the next one.
        }
      }
      throw new Error('Could not load the demo blueprint.');
    }

    // Playground can stop on its own error screen without ever answering, so
    // a start that takes longer than this counts as failed.
    function startWithin(ms, blueprint) {
      // A fresh frame for every start: a failed one may hold a broken runtime.
      const old = document.getElementById('demo-frame');
      const frame = old.cloneNode(false);
      old.replaceWith(frame);
      return Promise.race([
        startPlaygroundWeb({
          iframe: frame,
          remoteUrl: 'https://playground.wordpress.net/remote.html',
          blueprint
        }),
        new Promise((resolve, reject) => setTimeout(() => reject(new Error('Timed out.')), ms))
      ]);
    }

    try {
      const blueprint = await loadBlueprint();

      if (location.protocol === 'https:') {
        const installTheme = blueprint.steps.find(step => step.step === 'installTheme');
        installTheme.themeData.url = new URL('kerf-demo.zip', location.href).href;
      }

      // One more try before giving up: a first visit sometimes stops on
      // Playground's own error screen, without a word to this page, while a
      // second start works. A start takes about 20 seconds, so the first is
      // given 45; the second reuses what the browser has downloaded.
      let client;
      try {
        client = await startWithin(45000, blueprint);
      } catch (error) {
        loading.textContent = 'Starting WordPress again… a first visit can take a minute.';
        client = await startWithin(120000, blueprint);
      }
      // startPlaygroundWeb() returns once WordPress is up and the blueprint ran.
      await client.isReady();
      overlay.hidden = true;
    } catch (error) {
      loading.hidden = true;
      document.getElementById('demo-error').hidden = false;
    }
  </script>
</body>
</html>
